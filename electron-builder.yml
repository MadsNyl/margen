# Packaging and publishing for Margen. `pnpm dist:local` makes an unsigned
# build on your machine; .github/workflows/release.yml makes the signed and
# notarized release. The secrets it needs are listed in the README.
appId: app.margen.desktop
productName: Margen
copyright: Copyright © 2026 Mads Nylund

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json
  # The Agent SDK's bundled claude binaries: Margen runs the user's own claude (ADR 0002).
  - '!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**'
# dugite's bundled git runs from outside the asar; the hook fetches it for the arch being packed.
# The Voice addons (sherpa-onnx, piper-phonemize) load dylibs beside them and
# espeak-ng-data from their folder, so they run from outside the asar too;
# afterPack drops the other arch's copy.
asarUnpack:
  - '**/node_modules/dugite/git/**'
  - '**/node_modules/sherpa-onnx-*/**'
  - '**/node_modules/piper-phonemize-*/**'
# ffmpeg (build/ffmpeg.mjs, LGPL) runs from Resources/ffmpeg/, outside the asar, with its licence beside it.
extraResources:
  - from: vendor/ffmpeg/${arch}
    to: ffmpeg
    filter: [ffmpeg, COPYING.LGPLv2.1, README.txt]
beforePack: build/before-pack.mjs
afterPack: build/voice-addons.mjs
afterAllArtifactBuild: build/dugite-git-restore.mjs

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: true
  # Fail rather than skip when the notarization credentials are missing.
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The zip is what electron-updater downloads on macOS; the dmg is for people.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

# Not built yet, but nothing stands in the way of a Windows release.
win:
  icon: build/icon.png
  target: nsis

nsis:
  artifactName: ${productName}-${version}-setup.${ext}

# electron-updater reads the same feed from the packaged app-update.yml.
# Owner and repo come from package.json `repository`.
publish:
  provider: github
  releaseType: release
