# Builds, signs, notarizes and publishes Margen to GitHub Releases.
# Runs when a tag like v0.1.0 is pushed; the tag must match package.json's
# version. The secrets are listed in the README under "Releasing". Without
# any of them it publishes an unsigned (ad-hoc signed) build instead.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm e2e

      # All the signing secrets, or none: none makes an unsigned build, half a set is a mistake.
      - name: Signing secrets
        id: signing
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK$CSC_KEY_PASSWORD$APPLE_API_KEY_P8$APPLE_API_KEY_ID$APPLE_API_ISSUER$APPLE_ID$APPLE_APP_SPECIFIC_PASSWORD$APPLE_TEAM_ID" ]; then
            echo "::warning::No signing secrets: publishing an unsigned build"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=0
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::Set MAC_CERTIFICATE_P12_BASE64 and MAC_CERTIFICATE_PASSWORD"
            missing=1
          fi
          if [ -n "$APPLE_API_KEY_P8" ]; then
            if [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
              echo "::error::APPLE_API_KEY_P8 also needs APPLE_API_KEY_ID and APPLE_API_ISSUER"
              missing=1
            fi
          elif [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Set the App Store Connect API key secrets, or APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID"
            missing=1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          exit $missing

      # electron-builder wants a path to the .p8 file, not its contents.
      - name: App Store Connect API key
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
          fi

      - name: Build, sign, notarize and publish
        if: steps.signing.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A tag like v0.1.0-rc.1 publishes a pre-release, which the app's updater skips.
          EP_PRE_RELEASE: ${{ contains(github.ref_name, '-') }}
        run: pnpm release

      # Ad-hoc signed ("-") so it runs on Apple Silicon, without the hardened runtime, which
      # refuses Electron's ad-hoc signed frameworks. macOS asks before opening it the first time.
      - name: Build and publish unsigned
        if: steps.signing.outputs.signed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          EP_PRE_RELEASE: ${{ contains(github.ref_name, '-') }}
        run: pnpm release -c.mac.identity=- -c.mac.notarize=false -c.mac.hardenedRuntime=false

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
