# Every check on a macOS runner, started by hand (Actions → CI → Run workflow).
# A failure uploads test-results/ (Playwright's error context and screenshots).
name: CI

on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Screen
        run: system_profiler SPDisplaysDataType | grep -iE "resolution|ui looks like" || true
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
